
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Ganesha's Maze Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-bright: #274a78;
    --bg-mid: #142642;
    --bg-deep: #05080f;
    --stone-light: #33455f;
    --stone: #263349;
    --stone-dark: #161f30;
    --floor-a: #263c56;
    --floor-b: #1c2f46;
    --gold: #f3c869;
    --gold-bright: #ffe3a1;
    --gold-dim: #b8862f;
    --cream: #fff4e2;
    --card-bg: #10192b;
    --card-bg-2: #070d18;
    --jewel: #6b3fa0;
    --jewel-light: #9c72c9;
    --green: #52c97a;
    --red: #e5545c;
    --bronze: #a85a2a;
    --bronze-light: #c97a3f;
    --shadow-strong: rgba(4,7,14,0.55);
    font-family: 'Poppins', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, var(--bg-bright) 0%, var(--bg-mid) 55%, var(--bg-deep) 100%);
    color: var(--cream);
  }

  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- ambient background ---------- */
  #bg-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .ember {
    position: absolute;
    bottom: -6%;
    border-radius: 50%;
    filter: blur(0.5px);
    animation-name: rise;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    12%  { opacity: 0.9; }
    85%  { opacity: 0.35; }
    100% { transform: translateY(-112vh) translateX(30px); opacity: 0; }
  }

  .mandala-glow {
    position: absolute;
    top: 50%; left: 50%;
    width: 150vmax; height: 150vmax;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(
      from 0deg,
      rgba(255,227,161,0.03) 0deg 4deg,
      rgba(0,0,0,0) 4deg 14deg
    );
    animation: spin 260s linear infinite;
    pointer-events: none;
    z-index: 0;
    mix-blend-mode: overlay;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .vignette {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 38%, rgba(4,7,14,0.6) 100%);
  }

  
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.98);
    transition: opacity 0.45s ease, transform 0.45s ease;
    z-index: 2;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }

 
  #menu-screen .title-wrap {
    text-align: center;
    margin-bottom: clamp(22px, 4vh, 48px);
  }
  .flourish {
    width: clamp(160px, 24vw, 260px);
    height: 22px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .flourish .line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim) 40%, var(--gold-dim) 60%, transparent);
  }
  .flourish .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px rgba(243,200,105,0.8);
    transform: rotate(45deg);
  }
  h1.title {
    font-family: 'Cinzel', serif;
    font-weight: 800;
    font-size: clamp(2.1rem, 6vw, 4.1rem);
    margin: 0;
    letter-spacing: 1px;
    background: linear-gradient(180deg, var(--gold-bright) 10%, var(--gold) 50%, var(--gold-dim) 92%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255,227,161,0.25);
  }
  .subtitle {
    font-family: 'Cinzel', serif;
    font-style: normal;
    font-size: clamp(0.75rem, 1.4vw, 0.95rem);
    color: var(--cream);
    opacity: 0.7;
    margin-top: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .menu-buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: min(320px, 78vw);
  }
  .btn {
    position: relative;
    overflow: hidden;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 16px 20px;
    border-radius: 4px;
    border: 1px solid rgba(243,200,105,0.5);
    cursor: pointer;
    color: var(--cream);
    background: linear-gradient(160deg, var(--card-bg), var(--card-bg-2));
    box-shadow: 0 8px 20px var(--shadow-strong), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }
  .btn:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 12px 28px rgba(0,0,0,0.5), 0 0 22px rgba(243,200,105,0.3);
  }
  .btn:active { transform: translateY(-1px) scale(0.98); }
  .btn.primary {
    background: linear-gradient(160deg, var(--bronze-light), var(--bronze));
    color: #2a0e04;
    border-color: rgba(255,244,226,0.5);
    font-weight: 700;
  }
  .btn.ghost {
    background: rgba(16,25,43,0.6);
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.45);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim { to { transform: scale(3.4); opacity: 0; } }

  /* ---------- game screen ---------- */
  #game-screen { flex-direction: column; justify-content: flex-start; padding-top: 2vh; }
  #game-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
  }
  canvas#maze-canvas {
    border-radius: 10px;
    box-shadow: 0 16px 50px rgba(6,10,18,0.55), 0 0 0 3px rgba(243,200,105,0.55), 0 0 46px rgba(80,140,230,0.25);
    max-width: 96vw;
    max-height: 78vh;
  }

  #hud {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 5;
    pointer-events: none;
  }
  .pill {
    background: rgba(9,15,26,0.8);
    border: 1px solid rgba(243,200,105,0.45);
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: var(--gold-bright);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  .pill svg { width: 14px; height: 14px; flex-shrink: 0; }
  .pill .val { font-family: 'Cinzel', serif; font-size: 0.95rem; letter-spacing: 0.5px; }

  #esc-hint {
    position: absolute;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.72rem;
    letter-spacing: 0.8px;
    color: rgba(255,244,226,0.6);
    z-index: 5;
  }

  /* ---------- touch controls ---------- */
  #touch-controls {
    position: absolute;
    bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    right: 18px;
    display: none;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 46px);
    gap: 4px;
    z-index: 6;
  }
  #touch-controls.show { display: grid; }
  .tbtn {
    background: rgba(243,200,105,0.16);
    border: 1px solid rgba(243,200,105,0.4);
    border-radius: 6px;
    color: var(--gold-bright);
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .tbtn:active { background: rgba(243,200,105,0.4); }
  .t-up { grid-column: 2; grid-row: 1; }
  .t-left { grid-column: 1; grid-row: 2; }
  .t-right { grid-column: 3; grid-row: 2; }
  .t-down { grid-column: 2; grid-row: 3; }

  
  #question-modal, #name-modal {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: rgba(6,10,18,0.6);
    backdrop-filter: blur(3px);
  }
  #question-modal.show, #name-modal.show { display: flex; }

  .card {
    width: min(560px, 88vw);
    background: linear-gradient(165deg, var(--card-bg), var(--card-bg-2));
    border: 1px solid rgba(243,200,105,0.5);
    border-radius: 8px;
    padding: 28px 28px 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 34px rgba(107,63,160,0.18);
    animation: cardIn 0.35s cubic-bezier(.2,.9,.3,1.3);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card.shake { animation: shakeCard 0.4s; }
  @keyframes shakeCard {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-5px); }
    80% { transform: translateX(5px); }
  }
  .card-eyebrow {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--jewel-light);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .card h2 {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.1rem, 2.4vw, 1.45rem);
    margin: 0 0 20px;
    color: var(--gold-bright);
    line-height: 1.45;
    font-weight: 600;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option-btn {
    text-align: left;
    padding: 13px 16px;
    border-radius: 5px;
    border: 1px solid rgba(243,200,105,0.25);
    background: rgba(255,244,226,0.03);
    color: var(--cream);
    font-family: 'Poppins', sans-serif;
    font-size: 0.92rem;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
    opacity: 0;
    animation: optIn 0.35s forwards;
  }
  .option-btn:nth-child(1){animation-delay:.05s}
  .option-btn:nth-child(2){animation-delay:.1s}
  .option-btn:nth-child(3){animation-delay:.15s}
  .option-btn:nth-child(4){animation-delay:.2s}
  @keyframes optIn { to { opacity: 1; } }
  .option-btn:hover { background: rgba(243,200,105,0.1); border-color: var(--gold); transform: translateX(2px); }
  .option-btn.correct { background: rgba(82,201,122,0.2); border-color: var(--green); }
  .option-btn.wrong { background: rgba(229,84,92,0.2); border-color: var(--red); }
  .option-letter {
    display: inline-block;
    width: 20px; height: 20px;
    line-height: 20px;
    text-align: center;
    border: 1px solid rgba(243,200,105,0.5);
    color: var(--gold-bright);
    font-size: 0.7rem;
    font-weight: 700;
    margin-right: 12px;
    border-radius: 2px;
  }
  .feedback {
    margin-top: 15px;
    min-height: 20px;
    font-weight: 600;
    font-size: 0.86rem;
    letter-spacing: 0.3px;
  }
  .feedback.ok { color: var(--green); }
  .feedback.bad { color: var(--red); }


  #name-modal .card { text-align: center; }
  .win-icon-wrap {
    width: 54px; height: 54px;
    margin: 0 auto 10px;
  }
  .win-icon-wrap svg { width: 100%; height: 100%; }
  .win-label {
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    color: var(--cream);
    opacity: 0.85;
    font-size: 0.95rem;
  }
  .time-display {
    font-family: 'Cinzel', serif;
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    color: var(--gold-bright);
    margin: 8px 0 20px;
    letter-spacing: 1px;
  }
  #name-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 5px;
    border: 1px solid rgba(243,200,105,0.45);
    background: rgba(255,244,226,0.05);
    color: var(--cream);
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    text-align: center;
    outline: none;
    margin-bottom: 18px;
  }
  #name-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(243,200,105,0.18); }

  
  #leaderboard-screen .card {
    width: min(480px, 88vw);
    max-height: 80vh;
    overflow-y: auto;
  }
  #leaderboard-screen h2 { text-align: center; }
  .lb-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 11px 8px;
    border-radius: 5px;
    opacity: 0;
    animation: rowIn 0.35s forwards;
  }
  .lb-row:nth-child(n) { animation-delay: calc(var(--i, 0) * 0.05s); }
  @keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .lb-row:nth-child(odd) { background: rgba(255,244,226,0.03); }
  .lb-rank {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-weight: 700; color: var(--gold-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    border: 1px solid rgba(184,134,47,0.4);
    border-radius: 50%;
    flex-shrink: 0;
  }
  .lb-row.top1 .lb-rank { color: #2a0e04; background: linear-gradient(160deg, var(--gold-bright), var(--gold)); border-color: var(--gold-bright); }
  .lb-row.top2 .lb-rank { color: #2a0e04; background: linear-gradient(160deg, #e7e7ef, #b9b9c6); border-color: #d7d7e0; }
  .lb-row.top3 .lb-rank { color: #2a0e04; background: linear-gradient(160deg, #d99a5a, #a9691c); border-color: #d99a5a; }
  .lb-name { flex: 1; font-weight: 600; }
  .lb-time { color: var(--gold-bright); font-weight: 700; font-family: 'Cinzel', serif; }
  .lb-empty { text-align: center; opacity: 0.7; padding: 20px 0; }
  .back-row { display: flex; justify-content: center; margin-top: 20px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(243,200,105,0.4); border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div class="mandala-glow"></div>
  <div id="bg-particles"></div>
  <div class="vignette"></div>

  <!-- MENU -->
  <section id="menu-screen" class="screen active">
    <div class="title-wrap">
      <div class="flourish"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
      <h1 class="title">Ganesha's Maze Quest</h1>
      <div class="subtitle">Find the path to the Modak</div>
    </div>
    <div class="menu-buttons">
      <button class="btn primary" id="play-btn">Play</button>
      <button class="btn ghost" id="leaderboard-btn">Leaderboard</button>
    </div>
  </section>

  <!-- GAME -->
  <section id="game-screen" class="screen">
    <div id="game-wrapper">
      <canvas id="maze-canvas"></canvas>
      <div id="hud">
        <div class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>
          <span class="val" id="timer-display">0.0s</span>
        </div>
        <div class="pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <span class="val" id="gates-display">5</span>
        </div>
      </div>
      <div id="esc-hint">ARROW KEYS / WASD TO MOVE &nbsp;&middot;&nbsp; ESC FOR MENU</div>
      <div id="touch-controls">
        <div class="tbtn t-up" data-dir="up">▲</div>
        <div class="tbtn t-left" data-dir="left">◀</div>
        <div class="tbtn t-right" data-dir="right">▶</div>
        <div class="tbtn t-down" data-dir="down">▼</div>
      </div>

      <div id="question-modal">
        <div class="card" id="question-card">
          <div class="card-eyebrow">A gate blocks the way</div>
          <h2 id="question-text"></h2>
          <div class="options" id="options-wrap"></div>
          <div class="feedback" id="feedback-text"></div>
        </div>
      </div>

      <div id="name-modal">
        <div class="card">
          <div class="win-icon-wrap">
            <svg viewBox="0 0 48 48" fill="none">
              <path d="M24 4 L27 18 L24 24 L21 18 Z" fill="#f3c869"/>
              <ellipse cx="24" cy="30" rx="14" ry="9" fill="#c97a3f" stroke="#f3c869" stroke-width="1"/>
              <ellipse cx="24" cy="27" rx="10" ry="5.5" fill="#ffe3a1" opacity="0.5"/>
            </svg>
          </div>
          <div class="win-label">You reached the Modak</div>
          <div class="time-display" id="final-time-display">0.00s</div>
          <input id="name-input" type="text" maxlength="15" placeholder="Enter your name" autocomplete="nickname" />
          <input id="campus-input" type="text" maxlength="40" placeholder="Enter your campus (optional)" autocomplete="organization" style="width:100%;padding:13px 14px;border-radius:5px;border:1px solid rgba(243,200,105,0.45);background:rgba(255,244,226,0.05);color:var(--cream);font-family:'Poppins',sans-serif;font-size:1rem;text-align:center;outline:none;margin-bottom:18px" />
          <div id="score-status" style="min-height:20px;font-size:.78rem;opacity:.78;margin:-6px 0 12px"></div>
          <button class="btn primary" id="save-score-btn" style="width:100%">Save &amp; view leaderboard</button>
        </div>
      </div>
    </div>
  </section>

  <!-- LEADERBOARD -->
  <section id="leaderboard-screen" class="screen">
    <div class="card">
      <h2>Top Maze Times</h2>
      <div id="lb-list"></div>
      <div class="back-row">
        <button class="btn ghost" id="back-btn">Back to menu</button>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  /* ================= Question pool ================= */
  const QUESTIONS_POOL = [
    { q: "Who are Ganesha's parents?", options: ["Shiva and Parvati", "Vishnu and Lakshmi", "Brahma and Saraswati", "Indra and Indrani"], answer: 0 },
    { q: "What is Ganesha's vahana (vehicle)?", options: ["Lion", "Mouse", "Peacock", "Bull"], answer: 1 },
    { q: "What is Ganesha's favorite sweet?", options: ["Jalebi", "Barfi", "Modak", "Ladoo"], answer: 2 },
    { q: "Which festival celebrates Ganesha's birth?", options: ["Diwali", "Navratri", "Holi", "Ganesh Chaturthi"], answer: 3 },
    { q: "Who is Ganesha's brother?", options: ["Kartikeya", "Hanuman", "Indra", "Agni"], answer: 0 },
    { q: "What animal's head does Ganesha have?", options: ["Lion", "Horse", "Elephant", "Snake"], answer: 2 },
    { q: "Ganesha is widely known as the remover of...", options: ["Diseases", "Obstacles", "Debts", "Fears"], answer: 1 },
    { q: "What did Ganesha break off and use as a pen to write scriptures?", options: ["A finger", "His tusk", "A stick", "A flower"], answer: 1 },
    { q: "Which sage is said to have narrated the Mahabharata for Ganesha to write down?", options: ["Sage Vyasa", "Sage Valmiki", "Sage Narada", "Sage Vashistha"], answer: 0 },
    { q: "How many arms does Ganesha traditionally have in most classic depictions?", options: ["Two", "Four", "Six", "Eight"], answer: 1 },
    { q: '"Ganapati" is another popular name for Ganesha meaning...', options: ["Lord of the Ganas", "King of Elephants", "Keeper of the Mice", "Guardian of Fire"], answer: 0 },
    { q: "Which weapon-like object does Ganesha often hold, symbolizing the cutting of attachments?", options: ["A sword", "An axe (parashu)", "A spear", "A bow"], answer: 1 },
    { q: "What does the noose (pasha) Ganesha holds symbolize?", options: ["Control over desires", "Victory in war", "Protection from rain", "Wealth"], answer: 0 },
    { q: "Ganesha is traditionally worshipped first before beginning...", options: ["Any new venture", "Only weddings", "Only exams", "Only festivals"], answer: 0 },
    { q: '"Vinayaka" is another common name for which deity?', options: ["Ganesha", "Shiva", "Vishnu", "Kartikeya"], answer: 0 },
    { q: "In a popular legend, Ganesha's original head was replaced with an elephant's head by...", options: ["Shiva", "Vishnu", "Brahma", "Indra"], answer: 0 },
  ];

  /* ================= Maze constants ================= */

  let TILE = 40;
  let grid = [];
  let gates = [];
  let player = { x: START.x + 0.5, y: START.y + 0.5, facing: 1 };
  let modakPos = { x: END.x, y: END.y };

  /* ================= Maze generation ================= */
  function generateMaze(cols, rows) {
    const m = Array.from({ length: rows }, () => Array(cols).fill(1));
    const stack = [[1, 1]];
    m[1][1] = 0;
    while (stack.length) {
      const [x, y] = stack.pop();
      const dirs = [[2, 0], [-2, 0], [0, 2], [0, -2]];
      for (let i = dirs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [dirs[i], dirs[j]] = [dirs[j], dirs[i]];
      }
      for (const [dx, dy] of dirs) {
        const nx = x + dx, ny = y + dy;
        if (nx > 0 && nx < cols - 1 && ny > 0 && ny < rows - 1 && m[ny][nx] === 1) {
          m[ny][nx] = 0;
          m[y + dy / 2][x + dx / 2] = 0;
          stack.push([nx, ny]);
        }
      }
    }
    return m;
  }

  function bfsPath(m, start, end) {
    const rows = m.length, cols = m[0].length;
    const visited = new Map();
    const key = (x, y) => x + "," + y;
    visited.set(key(start.x, start.y), null);
    const q = [[start.x, start.y]];
    let qi = 0;
    while (qi < q.length) {
      const [cx, cy] = q[qi++];
      if (cx === end.x && cy === end.y) break;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy;
        if (nx >= 0 && nx < cols && ny >= 0 && ny < rows && m[ny][nx] === 0 && !visited.has(key(nx, ny))) {
          visited.set(key(nx, ny), key(cx, cy));
          q.push([nx, ny]);
        }
      }
    }
    if (!visited.has(key(end.x, end.y))) return [];
    const path = [];
    let cur = key(end.x, end.y);
    while (cur !== null) {
      const [x, y] = cur.split(",").map(Number);
      path.push({ x, y });
      cur = visited.get(cur);
    }
    path.reverse();
    return path;
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function prepareQuestion(template) {
    const opts = template.options.slice();
    const correctText = opts[template.answer];
    const shuffled = shuffle(opts);
    return { q: template.q, options: shuffled, answer: shuffled.indexOf(correctText) };
  }

  function buildGates(path) {
    const inner = path.length > 10 ? path.slice(2, -2) : path.slice(1, -1);
    const n = Math.min(NUM_GATES, inner.length);
    const positions = [];
    for (let i = 0; i < n; i++) {
      let idx = Math.floor(((i + 1) * inner.length) / (n + 1));
      idx = Math.max(0, Math.min(idx, inner.length - 1));
      positions.push(inner[idx]);
    }
    const uniq = [];
    const seen = new Set();
    for (const p of positions) {
      const k = p.x + "," + p.y;
      if (!seen.has(k)) { seen.add(k); uniq.push(p); }
    }
    const templates = shuffle(QUESTIONS_POOL).slice(0, uniq.length);
    return uniq.map((pos, i) => ({ pos, opened: false, question: prepareQuestion(templates[i]) }));
  }

  function getGateAt(cx, cy) {
    return gates.find(g => !g.opened && g.pos.x === cx && g.pos.y === cy) || null;
  }

  function newMaze() {
    let path;
    do {
      grid = generateMaze(COLS, ROWS);
      path = bfsPath(grid, START, END);
    } while (path.length === 0);
    gates = buildGates(path);
    player.x = START.x + 0.5;
    player.y = START.y + 0.5;
  }

  /* ================= Canvas / rendering ================= */
  const canvas = document.getElementById("maze-canvas");
  const ctx = canvas.getContext("2d");

  function resizeCanvas() {
    const wrapper = document.getElementById("game-wrapper");
    const availW = wrapper.clientWidth * 0.94;
    const availH = wrapper.clientHeight * 0.82;
    TILE = Math.max(16, Math.floor(Math.min(availW / COLS, availH / ROWS)));
    canvas.width = TILE * COLS;
    canvas.height = TILE * ROWS;
  }
  window.addEventListener("resize", resizeCanvas);

  // deterministic per-cell pseudo-random shade for stone texture
  function hash2(x, y) {
    const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return h - Math.floor(h);
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) + amt, g = ((n >> 8) & 0xff) + amt, b = (n & 0xff) + amt;
    r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b));
    return `rgb(${r},${g},${b})`;
  }

  function drawFloorAndWalls() {
    const W = canvas.width, H = canvas.height;
    const isWallCell = (x, y) => y >= 0 && y < ROWS && x >= 0 && x < COLS && grid[y][x] === 1;

    // ---- one continuous floor surface (no per-tile blocks) — vibrant orange ----
    const floorGrad = ctx.createLinearGradient(0, 0, W, H);
    floorGrad.addColorStop(0, "#3a5079");
    floorGrad.addColorStop(0.55, "#243453");
    floorGrad.addColorStop(1, "#0e1526");
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, 0, W, H);

    // organic multi-tone speckle texture on the floor (more than two flat colors)
    const floorTones = ["rgba(255,255,255,0.06)", "rgba(0,0,0,0.2)", "rgba(120,160,220,0.08)", "rgba(0,0,0,0.28)", "rgba(120,160,220,0.05)"];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (isWallCell(x, y)) continue;
        const px = x * TILE, py = y * TILE;
        for (let s = 0; s < 5; s++) {
          const rx = hash2(x * 3.7 + s * 1.31, y * 5.13 + s * 2.7);
          const ry = hash2(x * 9.1 + s * 0.7, y * 2.3 + s * 4.4);
          const rot = hash2(x + s * 2.2, y - s * 1.6) * Math.PI;
          const size = TILE * (0.1 + hash2(x - s, y + s * 1.7) * 0.2);
          ctx.fillStyle = floorTones[s % floorTones.length];
          ctx.beginPath();
          ctx.ellipse(px + rx * TILE, py + ry * TILE, size, size * 0.65, rot, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // ---- walls as a single continuous stone mass — deep contrasting blue ----
    const wallGrad = ctx.createLinearGradient(0, 0, W, H);
    wallGrad.addColorStop(0, "#e8802f");
    wallGrad.addColorStop(0.5, "#c9621e");
    wallGrad.addColorStop(1, "#9c4614");
    ctx.fillStyle = wallGrad;
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (isWallCell(x, y)) ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
      }
    }

    // stone-grain speckle texture on the walls (multi-tone, irregular — not a checker)
    const wallTones = ["rgba(255,210,140,0.16)", "rgba(120,50,10,0.20)", "rgba(255,235,190,0.10)", "rgba(90,35,8,0.26)"];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!isWallCell(x, y)) continue;
        const px = x * TILE, py = y * TILE;
        for (let s = 0; s < 4; s++) {
          const rx = hash2(x * 4.3 + s * 1.7, y * 6.1 + s * 3.3);
          const ry = hash2(x * 8.3 + s * 0.9, y * 3.9 + s * 2.1);
          const rot = hash2(x - s * 1.4, y + s * 1.9) * Math.PI;
          const size = TILE * (0.07 + hash2(x + s, y - s) * 0.15);
          ctx.fillStyle = wallTones[s % wallTones.length];
          ctx.beginPath();
          ctx.ellipse(px + rx * TILE, py + ry * TILE, size, size * 0.75, rot, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // ---- contour relief only along the actual wall/floor boundary (warm glow on the orange side) ----
    ctx.lineWidth = Math.max(1.4, TILE * 0.05);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!isWallCell(x, y)) continue;
        const px = x * TILE, py = y * TILE;
        if (!isWallCell(x, y - 1)) {
          ctx.strokeStyle = "rgba(255,205,140,0.55)";
          ctx.beginPath(); ctx.moveTo(px, py + 1); ctx.lineTo(px + TILE, py + 1); ctx.stroke();
        }
        if (!isWallCell(x, y + 1)) {
          ctx.strokeStyle = "rgba(0,0,0,0.45)";
          ctx.beginPath(); ctx.moveTo(px, py + TILE - 1); ctx.lineTo(px + TILE, py + TILE - 1); ctx.stroke();
        }
        if (!isWallCell(x - 1, y)) {
          ctx.strokeStyle = "rgba(255,205,140,0.32)";
          ctx.beginPath(); ctx.moveTo(px + 1, py); ctx.lineTo(px + 1, py + TILE); ctx.stroke();
        }
        if (!isWallCell(x + 1, y)) {
          ctx.strokeStyle = "rgba(0,0,0,0.32)";
          ctx.beginPath(); ctx.moveTo(px + TILE - 1, py); ctx.lineTo(px + TILE - 1, py + TILE); ctx.stroke();
        }
      }
    }
  }

  function drawGate(g, t) {
    const px = g.pos.x * TILE, py = g.pos.y * TILE;
    const cx = px + TILE / 2, cy = py + TILE / 2;
    const pulse = 0.5 + 0.5 * Math.sin(t / 340);
    const w = TILE * 0.78, h = TILE * 0.82;
    const top = cy - h / 2, bottom = cy + h / 2, left = cx - w / 2, right = cx + w / 2;

    ctx.save();
    ctx.shadowColor = "rgba(107,63,160,0.7)";
    ctx.shadowBlur = 6 + pulse * 8;
    ctx.beginPath();
    ctx.moveTo(left, bottom);
    ctx.lineTo(left, top + w / 2);
    ctx.quadraticCurveTo(left, top, cx, top);
    ctx.quadraticCurveTo(right, top, right, top + w / 2);
    ctx.lineTo(right, bottom);
    ctx.closePath();
    const grad = ctx.createLinearGradient(left, top, right, bottom);
    grad.addColorStop(0, "#7a4bb0");
    grad.addColorStop(1, "#4a2870");
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = `rgba(243,200,105,${0.55 + pulse * 0.3})`;
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // lock glyph
    const lx = cx, ly = cy + h * 0.06;
    ctx.strokeStyle = "#f3d98a";
    ctx.lineWidth = Math.max(1.4, TILE * 0.045);
    ctx.beginPath();
    ctx.arc(lx, ly - TILE * 0.1, TILE * 0.1, Math.PI, 0);
    ctx.stroke();
    ctx.fillStyle = "#f3d98a";
    const bw = TILE * 0.22, bh = TILE * 0.17;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(lx - bw / 2, ly - TILE * 0.02, bw, bh, 2) : ctx.rect(lx - bw / 2, ly - TILE * 0.02, bw, bh);
    ctx.fill();
  }

  function drawModak(t) {
    const cx = (modakPos.x + 0.5) * TILE, cy = (modakPos.y + 0.5) * TILE;
    const pulse = 0.5 + 0.5 * Math.sin(t / 500);
    const r = TILE * 0.34;

    // shadow
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy + r * 1.05, r * 0.9, r * 0.28, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(6,10,18,0.4)";
    ctx.fill();
    ctx.restore();

    // ambient glow
    ctx.save();
    const glow = ctx.createRadialGradient(cx, cy, r * 0.2, cx, cy, r * 1.8);
    glow.addColorStop(0, `rgba(255,227,161,${0.2 + pulse * 0.12})`);
    glow.addColorStop(1, "rgba(255,227,161,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r * 1.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // real modak photo
    if (MODAK_IMG.complete && MODAK_IMG.naturalWidth > 0) {
      const h = r * 2.3;
      const w = h * (MODAK_IMG.naturalWidth / MODAK_IMG.naturalHeight);
      ctx.drawImage(MODAK_IMG, cx - w / 2, cy - h / 2, w, h);
    }
  }

  function drawGanesha(t) {
    const cx = player.x * TILE, cy = player.y * TILE;
    const r = TILE * 0.42;

    ctx.save();
    ctx.translate(cx, cy);

    // ground shadow
    ctx.beginPath();
    ctx.ellipse(0, r * 1.15, r * 1.05, r * 0.32, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(4,7,14,0.42)";
    ctx.fill();

    // faint aura
    const halo = ctx.createRadialGradient(0, -r * 0.1, r * 0.3, 0, -r * 0.1, r * 1.6);
    halo.addColorStop(0, "rgba(243,200,105,0.14)");
    halo.addColorStop(1, "rgba(243,200,105,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, -r * 0.1, r * 1.6, 0, Math.PI * 2);
    ctx.fill();

    // real Ganesha illustration, gently facing the direction of travel
    if (GANESHA_IMG.complete && GANESHA_IMG.naturalWidth > 0) {
      const h = r * 2.6;
      const w = h * (GANESHA_IMG.naturalWidth / GANESHA_IMG.naturalHeight);
      const sway = Math.sin(t / 500) * 0.03;
      ctx.save();
      ctx.rotate(sway);
      if (player.facing < 0) ctx.scale(-1, 1);
      ctx.drawImage(GANESHA_IMG, -w / 2, -h + r * 1.15, w, h);
      ctx.restore();
    }

    ctx.restore();
  }


  /* ================= Game state / loop ================= */
  const State = { MENU: "menu", PLAYING: "playing", QUESTION: "question", NAME: "name", LEADERBOARD: "leaderboard" };
  let state = State.MENU;
  let activeGate = null;
  let startTime = 0, pausedAccum = 0, pauseStart = 0, finalTime = 0;
  let lastTs = 0;

  const keys = { up: false, down: false, left: false, right: false };

  function elapsedSeconds() {
    if (state === State.PLAYING) return (performance.now() - startTime - pausedAccum) / 1000;
    return finalTime;
  }

  function isWallOrClosedGate(cx, cy) {
    if (cy < 0 || cy >= ROWS || cx < 0 || cx >= COLS) return true;
    if (grid[cy][cx] === 1) return "wall";
    const g = getGateAt(cx, cy);
    if (g) return "gate";
    return false;
  }

  function update(dt) {
    if (state !== State.PLAYING) return;
    const speed = 4.2;
    let dx = 0, dy = 0;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }
    if (dx !== 0) player.facing = dx > 0 ? 1 : -1;

    const nx = player.x + dx * speed * dt;
    const ny = player.y + dy * speed * dt;
    const margin = 0.28;

    let blockedX = false;
    if (dx !== 0) {
      const testX = dx > 0 ? nx + margin : nx - margin;
      const cellX = Math.floor(testX), cellY = Math.floor(player.y);
      const res = isWallOrClosedGate(cellX, cellY);
      if (res === "gate") { triggerGate(getGateAt(cellX, cellY)); blockedX = true; }
      else if (res === "wall" || res === true) blockedX = true;
    }
    if (!blockedX) player.x = nx;

    let blockedY = false;
    if (dy !== 0) {
      const testY = dy > 0 ? ny + margin : ny - margin;
      const cellX = Math.floor(player.x), cellY = Math.floor(testY);
      const res = isWallOrClosedGate(cellX, cellY);
      if (res === "gate") { triggerGate(getGateAt(cellX, cellY)); blockedY = true; }
      else if (res === "wall" || res === true) blockedY = true;
    }
    if (!blockedY) player.y = ny;

    const dist = Math.hypot(player.x - (modakPos.x + 0.5), player.y - (modakPos.y + 0.5));
    if (dist < 0.4) onReachModak();
  }

  function render(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawFloorAndWalls();
    for (const g of gates) if (!g.opened) drawGate(g, t);
    drawModak(t);
    drawGanesha(t);
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
    lastTs = ts;
    update(dt);
    if (state === State.PLAYING || state === State.QUESTION) render(ts);
    document.getElementById("timer-display").textContent = elapsedSeconds().toFixed(1) + "s";
    document.getElementById("gates-display").textContent = gates.filter(g => !g.opened).length;
    requestAnimationFrame(loop);
  }

  function triggerGate(gate) {
    if (!gate || state !== State.PLAYING) return;
    activeGate = gate;
    pauseStart = performance.now();
    state = State.QUESTION;
    openQuestionModal(gate);
  }

  function onReachModak() {
    if (state !== State.PLAYING) return;
    finalTime = elapsedSeconds();
    state = State.NAME;
    document.getElementById("final-time-display").textContent = finalTime.toFixed(2) + "s";
    document.getElementById("name-input").value = "";
    document.getElementById("campus-input").value = "";
    document.getElementById("score-status").textContent = "";
    document.getElementById("name-modal").classList.add("show");
    launchConfetti();
    setTimeout(() => document.getElementById("name-input").focus(), 200);
  }

  /* ================= Question modal logic ================= */
  const qModal = document.getElementById("question-modal");
  const qCard = document.getElementById("question-card");
  const qText = document.getElementById("question-text");
  const optsWrap = document.getElementById("options-wrap");
  const feedbackText = document.getElementById("feedback-text");

  function openQuestionModal(gate) {
    qText.textContent = gate.question.q;
    optsWrap.innerHTML = "";
    feedbackText.textContent = "";
    feedbackText.className = "feedback";
    const letters = ["A", "B", "C", "D"];
    gate.question.options.forEach((opt, i) => {
      const b = document.createElement("button");
      b.className = "option-btn";
      b.innerHTML = `<span class="option-letter">${letters[i]}</span>${opt}`;
      b.addEventListener("click", () => answerGate(i, b));
      optsWrap.appendChild(b);
    });
    qModal.classList.add("show");
  }

  function closeQuestionModal() {
    qModal.classList.remove("show");
  }

  function answerGate(idx, btnEl) {
    if (!activeGate) return;
    const correct = idx === activeGate.question.answer;
    const allBtns = optsWrap.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.style.pointerEvents = "none");
    if (correct) {
      btnEl.classList.add("correct");
      feedbackText.textContent = "Correct — the gate opens.";
      feedbackText.className = "feedback ok";
      activeGate.opened = true;
      setTimeout(() => {
        closeQuestionModal();
        pausedAccum += performance.now() - pauseStart;
        activeGate = null;
        state = State.PLAYING;
        allBtns.forEach(b => b.style.pointerEvents = "auto");
      }, 750);
    } else {
      btnEl.classList.add("wrong");
      feedbackText.textContent = "Not quite — try again.";
      feedbackText.className = "feedback bad";
      qCard.classList.remove("shake");
      void qCard.offsetWidth;
      qCard.classList.add("shake");
      setTimeout(() => {
        btnEl.classList.remove("wrong");
        allBtns.forEach(b => b.style.pointerEvents = "auto");
      }, 500);
    }
  }

  document.addEventListener("keydown", (e) => {
    if (state === State.QUESTION && ["1", "2", "3", "4"].includes(e.key)) {
      const idx = Number(e.key) - 1;
      const btns = optsWrap.querySelectorAll(".option-btn");
      if (btns[idx]) answerGate(idx, btns[idx]);
    }
  });

  /* ================= Confetti (gold/jewel tones) ================= */
  function launchConfetti() {
    const colors = ["#f3c869", "#c97a3f", "#9c72c9", "#52c97a", "#ffe3a1"];

      piece.style.height = size * 0.6 + "px";
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.opacity = "0.9";
      piece.style.zIndex = "20";
      piece.style.borderRadius = "1px";
      piece.style.pointerEvents = "none";
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      document.body.appendChild(piece);
      const duration = 2200 + Math.random() * 1400;
      const drift = (Math.random() - 0.5) * 160;
      const anim = piece.animate([
        { transform: piece.style.transform + " translateY(0px) translateX(0px)", opacity: 0.95 },
        { transform: `rotate(${Math.random() * 720}deg) translateY(100vh) translateX(${drift}px)`, opacity: 0.15 }
      ], { duration, easing: "cubic-bezier(.25,.46,.45,.94)" });
      anim.onfinish = () => piece.remove();
    }
  }

    const name = document.getElementById("name-input").value.trim().slice(0, 15) || "Player";
    const campus = document.getElementById("campus-input").value.trim().slice(0, 40);
    button.disabled = true;
    status.textContent = "Saving score...";
    try {
      const result = await saveScore(name, campus, finalTime);
      status.textContent = result.online ? "Score saved to the shared leaderboard." : "Saved locally. Add Supabase settings to share scores online.";
      document.getElementById("name-modal").classList.remove("show");
      await renderLeaderboard();
      state = State.LEADERBOARD;
      showScreen("leaderboard");
    } catch (error) {
      console.error("Score save error", error);
      status.textContent = "Could not reach the online leaderboard. Please try again.";
    } finally {
      button.disabled = false;
    }
  });
  document.getElementById("name-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("save-score-btn").click();
  });

  function ripple(e) {
    const btn = e.currentTarget;
    const r = document.createElement("span");
    r.className = "ripple";
    const rect = btn.getBoundingClientRect();
    r.style.left = (e.clientX - rect.left) + "px";
    r.style.top = (e.clientY - rect.top) + "px";
    btn.appendChild(r);
    setTimeout(() => r.remove(), 650);
  }

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
    if (e.key === "Escape" && (state === State.PLAYING || state === State.QUESTION)) {
      state = State.MENU;
      qModal.classList.remove("show");
      showScreen("menu");
    }
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.up = true;
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.down = true;
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
    if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keys.up = false;
    if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keys.down = false;
  });

  function setupTouch() {
    const wrap = document.getElementById("touch-controls");
    if (window.matchMedia("(pointer: coarse)").matches) wrap.classList.add("show");
    wrap.querySelectorAll(".tbtn").forEach(btn => {
      const dir = btn.dataset.dir;
      const on = (e) => { e.preventDefault(); keys[dir] = true; };
      const off = (e) => { e.preventDefault(); keys[dir] = false; };
      btn.addEventListener("touchstart", on, { passive: false });
      btn.addEventListener("touchend", off, { passive: false });
      btn.addEventListener("touchcancel", off, { passive: false });
      btn.addEventListener("mousedown", on);
      btn.addEventListener("mouseup", off);
      btn.addEventListener("mouseleave", off);
    });
  }

  /* ================= Ambient embers ================= */
  function spawnEmbers() {
    const container = document.getElementById("bg-particles");
    for (let i = 0; i < 24; i++) {
      const p = document.createElement("div");
      p.className = "ember";
      const size = 3 + Math.random() * 5;
      p.style.width = size + "px";
      p.style.height = size + "px";
      p.style.left = Math.random() * 100 + "vw";
      const warm = Math.random() > 0.5 ? "#e8c47a" : "#d9873f";
      p.style.background = warm;
      p.style.boxShadow = `0 0 ${2 + size}px ${warm}`;
      p.style.opacity = "0.55";
      const dur = 12 + Math.random() * 14;
      p.style.animationDuration = dur + "s";
      p.style.animationDelay = (-Math.random() * dur) + "s";
      container.appendChild(p);
    }
  }

  /* ================= Init ================= */
  function init() {
    spawnEmbers();
    setupTouch();
    newMaze();
    resizeCanvas();
    render(0);
    requestAnimationFrame(loop);
  }
  init();
})();
</script>
</body>
</html>
